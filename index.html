<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EA KING CONNECT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a0a0a;color:#fff;font-family:Inter,Arial;padding:15px}h1{text-align:center;color:#FFD700;font-size:28px;margin:15px 0}h1 span{font-size:14px;display:block;color:#aaa;font-weight:400;margin-top:5px}.tabs{display:flex;gap:8px;margin:15px 0}button.tab{flex:1;padding:13px;background:#1a1a1a;border:1px solid #333;color:#ccc;border-radius:12px;font-weight:700;font-size:13px}button.tab.active{background:#FFD700;color:#000;border-color:#FFD700}.card{background:#161616;border:1px solid #FFD70033;border-radius:16px;padding:18px;margin:12px 0}label{color:#FFD700;font-size:12px;font-weight:700;display:block;margin-top:12px;letter-spacing:0.5px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#0a0a0a;color:#fff;margin-top:6px;font-size:14px}.row{display:flex;gap:10px}.row>div{flex:1}.btn{width:100%;padding:15px;border:none;border-radius:12px;font-weight:900;font-size:14px;margin-top:14px;cursor:pointer}.btn-gold{background:#FFD700;color:#000}.btn-white{background:#fff;color:#000}.btn-green{background:#25D366;color:#fff}.keybox{background:#000;border:1px dashed #00ff88;padding:14px;border-radius:12px;color:#00ff88;text-align:center;font-weight:800;margin-top:14px;word-break:break-all;display:none;font-size:14px}.codebox{background:#000;border:1px solid #222;padding:12px;border-radius:10px;color:#00ff88;white-space:pre-wrap;font-size:11px;max-height:350px;overflow:auto;margin-top:12px;display:none}.clientItem{background:#0a0a0a;border:1px solid #222;padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.badge{background:#FFD700;color:#000;padding:3px 8px;border-radius:20px;font-weight:800;font-size:10px}
</style></head><body>
<h1>👑 EA KING CONNECT <span>Build EA • License System • Like EA Connect</span></h1>

<div class="tabs">
<button class="tab active" onclick="tab('builder',this)">🤖 BUILDER</button>
<button class="tab" onclick="tab('license',this)">🔑 LICENSE</button>
<button class="tab" onclick="tab('clients',this)">👥 CLIENTS</button>
</div>

<!-- BUILDER TAB -->
<div id="builder" class="card">
<label>EA NAME</label><input id="eaName" value="EA KING Gold Scalper v2">
<label>STRATEGY TYPE (Like EA Connect)</label><select id="strat">
<option value="GOLD_SCALP_M1">Gold Scalper M1/M5 (EA Connect Style)</option>
<option value="RSI_EMA_TREND">RSI + EMA Trend</option>
<option value="MA_CROSS_RSI">MA Cross + RSI Filter</option>
<option value="BREAKOUT_ATR">Breakout + ATR</option>
<option value="SMC_OB_FVG">SMC - Order Block + FVG</option>
</select>
<div class="row"><div><label>LOT SIZE</label><input id="lot" type="number" value="0.10" step="0.01"></div><div><label>MAGIC NO</label><input id="magic" type="number" value="2026"></div></div>
<div class="row"><div><label>SL (points)</label><input id="sl" type="number" value="500"></div><div><label>TP (points)</label><input id="tp" type="number" value="1000"></div></div>
<label>TRADE FILTER</label><select id="filter"><option>Only Buy / Only Sell / Both</option><option value="BOTH" selected>Both Buy & Sell</option><option value="BUY">Only Buy</option><option value="SELL">Only Sell</option></select>
<button class="btn btn-gold" onclick="buildEA()">⚙️ GENERATE EA CODE (MQL5)</button>
<div id="mqcode" class="codebox"></div>
<button class="btn btn-white" id="copyBtn" style="display:none" onclick="copyCode()">📋 COPY MQL5 CODE - Paste in MetaEditor</button>
<div id="licenseSnippet" class="codebox" style="color:#FFD700;border-color:#FFD700"></div>
</div>

<!-- LICENSE TAB -->
<div id="license" class="card" style="display:none">
<label>CLIENT FULL NAME</label><input id="client" placeholder="Luyanda Omuhle Mkhize">
<label>MT4 / MT5 ACCOUNT NUMBER (LOCKED)</label><input id="acc" placeholder="e.g. 1234567">
<label>EA NAME TO LICENSE</label><input id="robotFor" placeholder="e.g. EA KING Gold Scalper">
<div class="row"><div><label>EXPIRY</label><select id="expiry"><option value="7">7 Days - Trial</option><option value="30">30 Days</option><option value="90">90 Days</option><option value="365" selected>365 Days - 1 Year</option><option value="9999">Lifetime ♾️</option></select></div><div><label>MAX ACCOUNTS</label><select id="maxAcc"><option>1 Account</option><option>2 Accounts</option><option selected>3 Accounts</option><option>5 Accounts</option></select></div></div>
<button class="btn btn-gold" onclick="genKey()">🔑 GENERATE LICENSE KEY (EA Connect System)</button>
<div id="k" class="keybox"></div>
<button class="btn btn-green" id="shareBtn" style="display:none" onclick="shareWA()">📲 SEND KEY VIA WHATSAPP</button>
<button class="btn btn-white" id="saveClientBtn" style="display:none" onclick="saveClient()">💾 SAVE TO CLIENT MANAGER</button>
</div>

<!-- CLIENTS TAB -->
<div id="clients" class="card" style="display:none">
<h3 style="color:#FFD700;margin-bottom:10px">👥 Saved Clients</h3>
<div id="clientList"><p style="color:#666;font-size:13px">No clients yet. Generate a license first.</p></div>
<button class="btn btn-white" onclick="clearClients()">🗑️ Clear All</button>
</div>

<script>
let clients = JSON.parse(localStorage.getItem('eaking_clients')||'[]');
function tab(id,el){
document.getElementById('builder').style.display=id=='builder'?'block':'none';
document.getElementById('license').style.display=id=='license'?'block':'none';
document.getElementById('clients').style.display=id=='clients'?'block':'none';
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');
if(id=='clients') renderClients();
}
function genKey(){
let c=document.getElementById('client').value||'CLIENT';
let a=document.getElementById('acc').value||'0000000';
let robot=document.getElementById('robotFor').value||'EA KING EA';
let exp=document.getElementById('expiry').value;
let r1=Math.random().toString(36).substr(2,4).toUpperCase();
let r2=Math.random().toString(36).substr(2,5).toUpperCase();
let r3=Math.random().toString(36).substr(2,4).toUpperCase();
let key=`EAKING-${r1}-${a.slice(-4)}-${r2}-${r3}-2026`;
let expDate=new Date(); expDate.setDate(expDate.getDate()+parseInt(exp));
window.lastKey=key;
window.lastClient={name:c,acc:a,robot:robot,key:key,expiry:expDate.toLocaleDateString(),days:exp};
document.getElementById('k').innerHTML=`🔑 ${key}<br><br><small style="color:#fff">👤 ${c}<br>🏦 Acc: ${a}<br>🤖 ${robot}<br>⏰ Expires: ${expDate.toLocaleDateString()} (${exp} days)</small>`;
document.getElementById('k').style.display='block';
document.getElementById('shareBtn').style.display='block';
document.getElementById('saveClientBtn').style.display='block';
}
function saveClient(){ clients.push(window.lastClient); localStorage.setItem('eaking_clients',JSON.stringify(clients)); alert('Saved! Check CLIENTS tab'); }
function renderClients(){
let html=''; if(clients.length==0){document.getElementById('clientList').innerHTML='<p style="color:#666;font-size:13px">No clients yet.</p>';return}
clients.forEach((cl,i)=>{ html+=`<div class="clientItem"><div><b>${cl.name}</b><br>Acc: ${cl.acc} • ${cl.robot}<br><span style="color:#888">Exp: ${cl.expiry}</span></div><div><span class="badge">${cl.key.split('-')[1]}</span><br><small style="color:#0f0">${cl.key}</small></div></div>`});
document.getElementById('clientList').innerHTML=html;
}
function clearClients(){ if(confirm('Clear all?')){ clients=[]; localStorage.removeItem('eaking_clients'); renderClients(); } }
function shareWA(){ let cl=window.lastClient; let txt=encodeURIComponent(`👑 *EA KING CONNECT LICENSE*\n\n🤖 EA: ${cl.robot}\n👤 Client: ${cl.name}\n🏦 Account: ${cl.acc} (LOCKED)\n🔑 License Key: ${cl.key}\n⏰ Expiry: ${cl.expiry} (${cl.days} days)\n\n_Paste this key in EA settings > LicenseKey_\n\nEA KING - Build Your Own Robots`); window.open('https://wa.me/?text='+txt,'_blank'); }
function buildEA(){
let name=document.getElementById('eaName').value; let lot=document.getElementById('lot').value; let sl=document.getElementById('sl').value; let tp=document.getElementById('tp').value; let magic=document.getElementById('magic').value; let strat=document.getElementById('strat').value;
let code=`//+------------------------------------------------------------------+
//| ${name}
//| Built with EA KING CONNECT - EA Connect Clone System
//| Strategy: ${strat} | Lot: ${lot} | SL: ${sl} | TP: ${tp}
//+------------------------------------------------------------------+
#property strict
#include <Trade/Trade.mqh>
CTrade trade;
input double LotSize = ${lot};
input int StopLoss = ${sl};
input int TakeProfit = ${tp};
input int MagicNumber = ${magic};
input string LicenseKey = "PASTE_YOUR_LICENSE_KEY_HERE";

//--- EA CONNECT STYLE LICENSE CHECK ---
bool CheckLicense(){
 if(StringLen(LicenseKey) < 15){ Print("EA KING: Invalid License Length"); return false; }
 if(StringFind(LicenseKey,"EAKING") < 0){ Print("EA KING: Invalid License Format"); return false; }
 // Optional: Check account number from key (last 4 digits)
 // Example: If key contains account suffix, validate AccountInfoInteger(ACCOUNT_LOGIN)
 string accStr = IntegerToString(AccountInfoInteger(ACCOUNT_LOGIN));
 string suffix = StringSubstr(LicenseKey,7,4); // Adapt to your key structure
 // if(StringFind(accStr,suffix) < 0) return false; // Uncomment to enforce
 return true;
}

int OnInit(){
 if(!CheckLicense()){
   Alert("❌ EA KING: Invalid License! Contact EA KING to activate. Acc: "+IntegerToString(AccountInfoInteger(ACCOUNT_LOGIN)));
   return(INIT_FAILED);
 }
 Print("✅ EA KING CONNECT - License Valid: "+LicenseKey+" | Acc: "+IntegerToString(AccountInfoInteger(ACCOUNT_LOGIN)));
 return(INIT_SUCCEEDED);
}

void OnTick(){
 if(!CheckLicense()) return;
 //--- ${strat} LOGIC ---
 double maFast = iMA(_Symbol,PERIOD_CURRENT,10,0,MODE_EMA,PRICE_CLOSE);
 double maSlow = iMA(_Symbol,PERIOD_CURRENT,20,0,MODE_EMA,PRICE_CLOSE);
 double rsi = iRSI(_Symbol,PERIOD_CURRENT,14,PRICE_CLOSE);
 bool buySignal = (maFast > maSlow && rsi < 65);
 bool sellSignal = (maFast < maSlow && rsi > 35);

 if(buySignal && PositionsTotal()==0){
   double slP = (StopLoss>0)? SymbolInfoDouble(_Symbol,SYMBOL_BID)-StopLoss*_Point*10 : 0;
   double tpP = (TakeProfit>0)? SymbolInfoDouble(_Symbol,SYMBOL_BID)+TakeProfit*_Point*10 : 0;
   trade.SetExpertMagicNumber(MagicNumber);
   trade.Buy(LotSize,_Symbol,0,slP,tpP,"EA KING BUY");
 }
 if(sellSignal && PositionsTotal()==0){
   double slP = (StopLoss>0)? SymbolInfoDouble(_Symbol,SYMBOL_ASK)+StopLoss*_Point*10 : 0;
   double tpP = (TakeProfit>0)? SymbolInfoDouble(_Symbol,SYMBOL_ASK)-TakeProfit*_Point*10 : 0;
   trade.SetExpertMagicNumber(MagicNumber);
   trade.Sell(LotSize,_Symbol,0,slP,tpP,"EA KING SELL");
 }
}
`;
document.getElementById('mqcode').innerText=code;
document.getElementById('mqcode').style.display='block';
document.getElementById('copyBtn').style.display='block';
document.getElementById('licenseSnippet').innerText="📋 LICENSE SYSTEM INCLUDED:\n1. Generate key in LICENSE tab\n2. Paste key in EA settings > LicenseKey\n3. EA locks to that account only\n\nLike EA Connect: Key = EAKING-XXXX-Acc-XXXX-2026";
document.getElementById('licenseSnippet').style.display='block';
}
function copyCode(){ navigator.clipboard.writeText(document.getElementById('mqcode').innerText); alert('✅ MQL5 Code Copied! Open MetaEditor > New EA > Paste > Compile'); }
renderClients();
</script></body></html>
