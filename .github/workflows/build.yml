name: Build EA KING CONNECT APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          npm install -g cordova
          cordova create apk com.eaking.connect "EA KING CONNECT"
          cp index.html apk/www/index.html
          cd apk
          cordova platform add android
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: EA-KING-CONNECT-APK
          path: apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
